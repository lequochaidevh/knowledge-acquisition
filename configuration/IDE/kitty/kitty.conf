# =============================================================================
# 🐚 CORE & SYSTEM
# =============================================================================
shell                           /usr/bin/bash
kitty_mod                       ctrl+shift

# =============================================================================
# 🔤 TYPOGRAPHY (Hack Nerd Font)
# =============================================================================
font_family                     Hack Nerd Font
bold_font                       Hack Nerd Font Bold
italic_font                     Hack Nerd Font Italic
bold_italic_font                Hack Nerd Font Bold Italic
font_size                       12.0

# =============================================================================
# 🎨 TRANSPARENCY & WALLPAPER TINTS
# =============================================================================
background_opacity              0.8
background_blur                 1

# Background Image Layout & Multi-Window Gaps
background_tint                 0.90
background_tint_gaps            -10

# =============================================================================
# 📐 WINDOW MANAGEMENT & BORDERS
# =============================================================================
enabled_layouts                 tall,*
enabled_layouts                 splits

# Sizing & Layout Spacing
window_margin_width             1
single_window_margin_width      0

# REMOVED manual hex overrides here so Kitty can read your Catppuccin theme!
# The borders will now beautifully match your Lavender and Mauve scheme.

# =============================================================================
# 🖌️ CURSOR MOTION & TRAILS
# =============================================================================
cursor_trail                    3
cursor_trail_decay              0.1 0.99
cursor_trail_start_threshold    0

# =============================================================================
# 🔖 POWERLINE TAB DESIGN
# =============================================================================
tab_bar_style                   powerline
tab_powerline_style             slanted
tab_activity_symbol             *

# =============================================================================
# 🖱️ MOUSE EVENT MAPS
# =============================================================================
mouse_map right click ungrabbed paste_from_clipboard
mouse_map shift+right click ungrabbed no_op

# =============================================================================
# ⌨️ ACTION SHORTCUTS & KEYBINDINGS
# =============================================================================
# Split Navigation Controls
map ctrl+alt+enter              launch --location=split
map ctrl+alt+v                  launch --location=vsplit --cwd=current
map ctrl+alt+h                  launch --location=hsplit --cwd=current

# Directional Window Traversal
map ctrl+h                      neighboring_window left
map ctrl+l                      neighboring_window right
map ctrl+k                      neighboring_window up
map ctrl+j                      neighboring_window down

# Tab Quick Selection Shortcuts
map alt+1                       goto_tab 1
map alt+2                       goto_tab 2
map alt+3                       goto_tab 3
map alt+4                       goto_tab 4
map alt+5                       goto_tab 5

# Global Utilities
map F1                          new_window_with_cwd
map F2                          launch --cwd=current /usr/bin/vi .
map ctrl+a                      no_op

# =============================================================================
# 🎨 DYNAMIC THEME ENGINE
# =============================================================================
include current-theme.conf
